# =============================================================================
# docker-compose.prod.yml — Production stack for single-server deployment
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# Services: caddy (reverse proxy) + web (Next.js) + backend (Spring Boot) + postgres
# =============================================================================

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    environment:
      - DOMAIN=${DOMAIN}
    depends_on:
      web:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - rentaxis-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - /data/contracts:/app/data
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING:-}
      - AZURE_STORAGE_CONTAINER_PREFIX=${AZURE_STORAGE_CONTAINER_PREFIX:-tenant-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_CHEQUE_DEPLOYMENT=${AZURE_OPENAI_CHEQUE_DEPLOYMENT:-gpt-4o}
      - AZURE_COMMUNICATION_CONNECTION_STRING=${AZURE_COMMUNICATION_CONNECTION_STRING:-}
      - AZURE_EMAIL_SENDER=${AZURE_EMAIL_SENDER:-}
      # Required in prod. The backend refuses to start without both rather than
      # accepting guard logins it cannot verify.
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_SERVICE_ACCOUNT_JSON_BASE64=${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64:-}
      - RENTAXIS_ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      # Auth hardening (phase 1). Empty default = feature off: Bearer tokens are
      # not issued/verified and the SUPER_ADMIN header gate stays open, so the
      # stack behaves exactly as before until the secrets are configured.
      - APP_AUTH_TOKEN_SECRET=${APP_AUTH_TOKEN_SECRET:-}
      - INTERNAL_PROXY_SECRET=${INTERNAL_PROXY_SECRET:-}
      # Signs the public renewal-intent links (audit B-F5, #129). Required: under
      # the prod profile the backend refuses to start when it is unset or equals
      # the dev default committed in application.yml.
      - APP_RENEWAL_TOKEN_SECRET=${APP_RENEWAL_TOKEN_SECRET:-}
      # Sign in with Apple token revocation on account deletion (Guideline
      # 5.1.1(v)). Empty default = revocation skipped; sign-in unaffected.
      - APPLE_SIGNIN_TEAM_ID=${APPLE_SIGNIN_TEAM_ID:-}
      - APPLE_SIGNIN_KEY_ID=${APPLE_SIGNIN_KEY_ID:-}
      - APPLE_SIGNIN_PRIVATE_KEY_BASE64=${APPLE_SIGNIN_PRIVATE_KEY_BASE64:-}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rentaxis-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - BACKEND_URL=http://backend:8080
      # Attached as X-Internal-Auth by the Next.js proxy so the backend can tell
      # proxy-asserted SUPER_ADMIN headers from client-forged ones. Empty
      # default = gate off (pre-rollout behaviour unchanged).
      - INTERNAL_PROXY_SECRET=${INTERNAL_PROXY_SECRET:-}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://0.0.0.0:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rentaxis-network

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rentaxis-network

volumes:
  caddy-data:
  caddy-config:
  caddy-logs:

networks:
  rentaxis-network:
    driver: bridge
