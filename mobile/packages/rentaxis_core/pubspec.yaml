name: rentaxis_core
description: "Shared core package for RentAxis mobile apps"
version: 0.0.1
homepage:

environment:
  sdk: ^3.10.8
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.5
  google_fonts: ^6.2.1
  go_router: ^14.8.1
  geolocator: ^13.0.1
  # Direct deps of core: the app-version gate (widgets/update_required_screen,
  # providers/app_version_provider) reads the running build with
  # package_info_plus and opens the store link with url_launcher. Both are used
  # in code that lives HERE, so core declares them directly rather than leaning
  # on the host apps' transitive copies (depend_on_referenced_packages).
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.2

flutter:
  assets:
    - assets/fonts/
