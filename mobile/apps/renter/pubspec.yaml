name: renter
description: "RentAxis Renter App"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  rentaxis_core:
    path: ../../packages/rentaxis_core
  # Declared directly — as manager and security already do — because the app's
  # own code reads Dio's error type to tell a 404 apart from a network failure.
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  permission_handler: ^11.3.1
  open_filex: ^4.5.0
  intl: ^0.19.0
  path_provider: ^2.1.5
  razorpay_flutter: ^1.3.7
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  google_maps_flutter: ^2.9.0
  photo_view: ^0.15.0
  qr_flutter: ^4.1.0
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo_horizontal.png
