name: security
description: "RentAxis Security Guard App"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  rentaxis_core:
    path: ../../packages/rentaxis_core
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  mobile_scanner: ^6.0.2
  # Used directly by the integration-test session harness.
  flutter_secure_storage: ^9.2.2
  intl: ^0.20.2
  dio: ^5.7.0
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  image_picker: ^1.1.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo_horizontal.png
    - assets/logo_mark.png
    - assets/splash_background.png
