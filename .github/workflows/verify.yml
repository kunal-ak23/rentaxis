name: Verify

# Manual only. Run it from the Actions tab, or with:
#
#   gh workflow run Verify --ref <branch>
#
# It used to run on every pull request and on every push to main, which meant
# the same commits were tested twice — once on the PR, then again on the
# squash-merge — for 10 to 18 minutes each time. The suite runs locally, so
# that was paid for twice and read once. Deploying to the VM is now the only
# thing a push to main starts.
#
# What this gives up, stated plainly so nobody rediscovers it the hard way:
# nothing automatic stands between a commit and production. That was the
# original reason for this file — four defects in the September review had been
# sitting in a green suite because the tests themselves encoded the bug, and
# deploy.yml ships images without running a single test. Running the suite
# before merging is now a person's job, not the pipeline's.
#
# Keeping it dispatchable costs nothing until someone asks for it, and is worth
# having for a change too large to be confident about locally.

on:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    # The suite is Testcontainers-backed and takes ~10 minutes locally; the
    # ceiling is generous so a slow container pull is not reported as a failure.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Testcontainers needs a working Docker daemon. ubuntu-latest ships one,
      # so this is a fail-fast assertion rather than a setup step: without it a
      # missing daemon surfaces as a confusing per-test timeout.
      - name: Verify Docker is available
        run: docker info > /dev/null && echo "docker ok"

      - name: Run tests
        working-directory: backend
        run: ./gradlew test --console=plain

      # The JUnit XML is the authoritative count. Printing it here means a run's
      # summary states how many tests actually ran, so a suite that silently
      # stops running tests is visible rather than passing quietly.
      - name: Summarise results
        if: always()
        working-directory: backend
        run: |
          python3 - <<'PY'
          import glob, re, os
          files = glob.glob('build/test-results/test/*.xml')
          t = f = e = s = 0
          for p in files:
              h = open(p, encoding='utf-8', errors='ignore').read(900)
              for key in ('tests', 'skipped', 'failures', 'errors'):
                  m = re.search(key + r'="(\d+)"', h)
                  if not m:
                      continue
                  v = int(m.group(1))
                  if key == 'tests': t += v
                  elif key == 'skipped': s += v
                  elif key == 'failures': f += v
                  else: e += v
          line = f"Backend: {t} tests in {len(files)} classes — {f} failures, {e} errors, {s} skipped"
          print(line)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as fh:
              fh.write(line + "\n")
          PY

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/build/reports/tests/test
          retention-days: 7

  # There is no web job here. The reason recorded above this line used to be
  # issue #233 — the committed lockfile described a macOS tree, so `npm ci`
  # could not install on a Linux runner. That was repaired in #235 and #233 is
  # closed, so the obstacle is gone; the job was simply never added back.
  #
  # Adding it would cost about two minutes and cover the web suite and
  # `tsc --noEmit`. Worth doing if this workflow ever gates merges again. While
  # it is dispatch-only, it would only run when someone asked for it.
