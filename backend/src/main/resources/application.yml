spring:
  application:
    name: RentAxis
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rentaxis}
    username: ${SPRING_DATASOURCE_USERNAME:rentaxis}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080

rentaxis:
  contracts:
    storage-path: ./data/contracts
  encryption:
    key: ${RENTAXIS_ENCRYPTION_KEY:}
  listings:
    max-media-size-bytes: ${RENTAXIS_LISTINGS_MAX_MEDIA_SIZE_BYTES:10485760}

azure:
  storage:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
    container: ${AZURE_STORAGE_CONTAINER:listings}
  openai:
    endpoint: ${AZURE_OPENAI_ENDPOINT:}
    api-key: ${AZURE_OPENAI_API_KEY:}
    deployment: ${AZURE_OPENAI_CHEQUE_DEPLOYMENT:gpt-4o}
    api-version: "2024-10-21"

gatepass:
  otp:
    # Delivery channel for security-guard login codes: log | whatsapp.
    #   log      -> LoggingOtpSender, prints the code (dev only, @Profile("!prod"))
    #   whatsapp -> AcsWhatsAppOtpSender, via the ACS resource below
    # Prod MUST set this to whatsapp. Leaving it unset there resolves to `log`,
    # whose sender is excluded under the prod profile — so no OtpSender bean
    # exists and the context fails fast at startup. That is deliberate: the
    # alternative is prod quietly logging every guard's live credential.
    channel: ${GATEPASS_OTP_CHANNEL:log}
    # ACS channel registration id for the connected WhatsApp Business number.
    # Unset -> the sender still starts (warns) and fails at send time.
    whatsapp-channel-id: ${ACS_WHATSAPP_CHANNEL_ID:}
    # Must match a Meta-APPROVED WhatsApp authentication template on that channel.
    template-name: ${GATEPASS_OTP_TEMPLATE_NAME:gatepass_otp}

cheque-extraction:
  retention-days: 90
  purge-cron: "0 0 3 * * *"

resilience4j:
  circuitbreaker:
    instances:
      chequeExtraction:
        sliding-window-type: TIME_BASED
        sliding-window-size: 30
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

app:
  renewal:
    scheduler:
      enabled: ${APP_RENEWAL_SCHEDULER_ENABLED:false}
    token-secret: ${APP_RENEWAL_TOKEN_SECRET:dev-only-please-rotate-in-prod-min-32-bytes-please}
    # Falls back to the public app URL (set on prod) so renewal-email CTAs are absolute,
    # not localhost. Local dev (no NEXT_PUBLIC_API_URL) still resolves to localhost:3000.
    portal-base-url: ${APP_RENEWAL_PORTAL_BASE_URL:${NEXT_PUBLIC_API_URL:http://localhost:3000}}
