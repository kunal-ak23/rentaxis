spring:
  application:
    name: RentAxis
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rentaxis}
    username: ${SPRING_DATASOURCE_USERNAME:rentaxis}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080

rentaxis:
  contracts:
    storage-path: ./data/contracts
  encryption:
    key: ${RENTAXIS_ENCRYPTION_KEY:}
  listings:
    max-media-size-bytes: ${RENTAXIS_LISTINGS_MAX_MEDIA_SIZE_BYTES:10485760}

azure:
  storage:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
    container: ${AZURE_STORAGE_CONTAINER:listings}
  openai:
    endpoint: ${AZURE_OPENAI_ENDPOINT:}
    api-key: ${AZURE_OPENAI_API_KEY:}
    deployment: ${AZURE_OPENAI_CHEQUE_DEPLOYMENT:gpt-4o}
    api-version: "2024-10-21"

firebase:
  auth:
    # The backend never sends SMS codes. The security app uses Firebase Phone
    # Authentication and sends the resulting ID token here for verification.
    # Both values are required in the prod profile; local/test contexts may boot
    # without them, but /api/v1/auth/firebase answers 503 until configured.
    project-id: ${FIREBASE_PROJECT_ID:}
    service-account-json-base64: ${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64:}

cheque-extraction:
  retention-days: 90
  purge-cron: "0 0 3 * * *"

resilience4j:
  circuitbreaker:
    instances:
      chequeExtraction:
        sliding-window-type: TIME_BASED
        sliding-window-size: 30
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

app:
  auth:
    # HS256 secret for bearer-token issuance/verification (>= 32 bytes when set).
    # The EMPTY default is deliberate: blank => token auth disabled, login
    # returns no token, the filter keeps trusting the legacy X-User-* headers —
    # byte-identical to pre-token behaviour until the secret is configured.
    # NO dev fallback here (unlike app.renewal.token-secret): a baked-in
    # secret reaching prod IS the header-spoofing vulnerability this fixes.
    token-secret: ${APP_AUTH_TOKEN_SECRET:}
    # Shared secret the web proxy attaches as X-Internal-Auth when asserting
    # SUPER_ADMIN via legacy headers. Empty => gate off (compat); set => any
    # legacy SUPER_ADMIN request without the matching header gets 403.
    internal-proxy-secret: ${INTERNAL_PROXY_SECRET:}
    # Phase-2 kill switch. "allow" (default) keeps the legacy header path;
    # "deny" rejects any non-public request lacking a valid bearer token.
    legacy-headers: ${APP_AUTH_LEGACY_HEADERS:allow}
  renewal:
    scheduler:
      enabled: ${APP_RENEWAL_SCHEDULER_ENABLED:false}
    token-secret: ${APP_RENEWAL_TOKEN_SECRET:dev-only-please-rotate-in-prod-min-32-bytes-please}
    # Falls back to the public app URL (set on prod) so renewal-email CTAs are absolute,
    # not localhost. Local dev (no NEXT_PUBLIC_API_URL) still resolves to localhost:3000.
    portal-base-url: ${APP_RENEWAL_PORTAL_BASE_URL:${NEXT_PUBLIC_API_URL:http://localhost:3000}}
