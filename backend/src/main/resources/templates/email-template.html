<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background-color:#FAFAF8;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#FAFAF8;padding:32px 0;">
<tr><td align="center">
<table width="560" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:12px;border:1px solid #E2E0DC;overflow:hidden;">
    <!-- Header -->
    <tr>
        <td style="background-color:#0F1B2D;padding:24px 32px;">
            <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                    <td style="color:#C8A951;font-size:20px;font-weight:700;letter-spacing:1px;">RentAxis</td>
                    <td align="right" style="color:rgba(255,255,255,0.5);font-size:11px;">Property Management</td>
                </tr>
            </table>
        </td>
    </tr>

    <!-- Body -->
    <tr>
        <td style="padding:32px;">
            <h2 style="margin:0 0 8px;color:#0F172A;font-size:18px;font-weight:600;">{{TITLE}}</h2>
            <p style="margin:0 0 24px;color:#475569;font-size:14px;line-height:1.6;">{{MESSAGE}}</p>

            {{ACTION_BUTTON}}

            <hr style="border:none;border-top:1px solid #E2E0DC;margin:24px 0;">

            <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#F5F4F0;border-radius:8px;padding:16px;">
                <tr>
                    <td style="padding:12px 16px;">
                        {{DETAILS}}
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <!-- Footer -->
    <tr>
        <td style="padding:20px 32px;border-top:1px solid #E2E0DC;background-color:#F5F4F0;">
            <p style="margin:0;color:#94A3B8;font-size:11px;text-align:center;line-height:1.6;">
                This is an automated notification from RentAxis Property Management System.<br>
                Please do not reply to this email.
            </p>
        </td>
    </tr>
</table>
</td></tr>
</table>
</body>
</html>
