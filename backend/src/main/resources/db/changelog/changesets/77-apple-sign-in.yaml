databaseChangeLog:
  - changeSet:
      id: 77-apple-sign-in
      author: codex
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: apple_subject
                  type: VARCHAR(255)
              - column:
                  name: apple_client_id
                  type: VARCHAR(255)
        - sql:
            sql: >-
              CREATE UNIQUE INDEX uq_users_apple_identity
              ON users (apple_client_id, apple_subject)
              WHERE apple_subject IS NOT NULL
                AND apple_client_id IS NOT NULL
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS uq_users_apple_identity
        - dropColumn:
            tableName: users
            columnName: apple_client_id
        - dropColumn:
            tableName: users
            columnName: apple_subject
