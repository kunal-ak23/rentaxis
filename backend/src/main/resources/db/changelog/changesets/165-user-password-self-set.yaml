databaseChangeLog:
  # One login per person across organisations (2026-10-15). Every users row with
  # the same normalised email shares one password whenever the PERSON sets it
  # (invite or reset link, which prove they read that inbox; or a change from a
  # password that was itself theirs). A row added for someone who already has a
  # login reuses that hash instead of sending an invite.
  #
  # password_self_set: true only when the current hash was chosen by the person
  #   through one of those paths, or copied from a row where it was. Only such a
  #   hash is ever copied to another organisation's row: a password an admin
  #   typed (or one whose provenance is unknown) must never open a second
  #   organisation. Every existing row starts false — the history cannot say who
  #   chose it — so an existing person is invited as before until they next set a
  #   password themselves. No password is overwritten by this changeset.
  # password_set_at: when the hash was last written; picks the newest when
  #   several self-set hashes disagree.
  - changeSet:
      id: 165-user-password-self-set
      author: claude
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: password_self_set
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: password_set_at
                  type: timestamptz
                  constraints:
                    nullable: true
      rollback:
        - dropColumn:
            tableName: users
            columnName: password_self_set
        - dropColumn:
            tableName: users
            columnName: password_set_at
