# Booking fees post to an income account: a parking bay or an amenity may name its own
# income leaf, and the new AMENITY_INCOME role gets a template row (C-01-02 "Amenity
# Income - {property}") for tenants that already have template rows. Per-property
# leaves are generated by PropertyAccountService.generateMissing, not here.
databaseChangeLog:
  - changeSet:
      id: 192-booking-income-account
      author: claude
      changes:
        - sql:
            comment: Income account on parking bays and amenities
            sql: |
              ALTER TABLE parking_spots ADD COLUMN income_account_id UUID REFERENCES accounts(id) ON DELETE SET NULL;
              ALTER TABLE property_amenities ADD COLUMN income_account_id UUID REFERENCES accounts(id) ON DELETE SET NULL;
        - sql:
            comment: AMENITY_INCOME template row
            sql: |
              INSERT INTO property_account_template_rows (id, tenant_id, role, name_pattern, parent_account_id, enabled)
              SELECT gen_random_uuid(), g.tenant_id, 'AMENITY_INCOME', 'Amenity Income - {property}', g.id, TRUE
                FROM accounts g
               WHERE g.code = 'C-01-02'
                 AND EXISTS (SELECT 1 FROM property_account_template_rows t WHERE t.tenant_id = g.tenant_id)
                 AND NOT EXISTS (SELECT 1 FROM property_account_template_rows t
                                  WHERE t.tenant_id = g.tenant_id AND t.role = 'AMENITY_INCOME');
      rollback:
        - sql:
            sql: |
              ALTER TABLE property_amenities DROP COLUMN income_account_id;
              ALTER TABLE parking_spots DROP COLUMN income_account_id;
              DELETE FROM property_account_mappings WHERE role = 'AMENITY_INCOME';
              DELETE FROM tenant_default_account_mappings WHERE role = 'AMENITY_INCOME';
              DELETE FROM property_account_template_rows WHERE role = 'AMENITY_INCOME';
              DELETE FROM accounts a WHERE a.report_line = 'AMENITY_INCOME' AND NOT a.is_group
                AND NOT EXISTS (SELECT 1 FROM journal_lines l WHERE l.account_id = a.id)
                AND NOT EXISTS (SELECT 1 FROM penalty_assessments p WHERE p.income_account_id = a.id);
              UPDATE accounts SET report_line = NULL WHERE report_line = 'AMENITY_INCOME';
