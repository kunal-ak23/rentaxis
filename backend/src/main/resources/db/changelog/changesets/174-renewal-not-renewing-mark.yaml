databaseChangeLog:
  # Scale PR C ruling (2026-10-17): "Not renewing" is a soft, reversible mark on the
  # renewal opportunity — who set it, when, and an optional note. It gives no notice,
  # changes no lease status and touches no listing; give notice stays its own act.
  # Renewing or extending the contract clears it, and so does Undo. Existing rows: NULL.
  - changeSet:
      id: 174-renewal-not-renewing-mark
      author: claude
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: renewal_opportunities
                columnName: not_renewing_at
      changes:
        - addColumn:
            tableName: renewal_opportunities
            columns:
              - column: { name: not_renewing_at, type: timestamptz }
              - column: { name: not_renewing_by, type: uuid }
              - column: { name: not_renewing_note, type: varchar(500) }
        - sql:
            sql: >-
              CREATE INDEX IF NOT EXISTS idx_renewal_opp_not_renewing ON renewal_opportunities (tenant_id, lease_id)
               WHERE not_renewing_at IS NOT NULL
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS idx_renewal_opp_not_renewing
        - dropColumn:
            tableName: renewal_opportunities
            columnName: not_renewing_note
        - dropColumn:
            tableName: renewal_opportunities
            columnName: not_renewing_by
        - dropColumn:
            tableName: renewal_opportunities
            columnName: not_renewing_at
