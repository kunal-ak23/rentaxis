databaseChangeLog:
  # #20: a ticket had no human reference — the list showed a UUID prefix, which
  # nobody can read over the phone. reference is "TKT-yy/n": a per-tenant counter
  # per calendar year from the same journal_entry_sequences table the journal
  # and addendum numbers use (series 'TKT'), assigned at creation.
  #
  # The year is the Dubai calendar year, as at runtime (the JVM runs on
  # Asia/Dubai). created_at is a zone-less timestamp holding UTC wall time (the
  # session is SET TIME ZONE 'UTC'), so it is read as UTC and converted: a
  # ticket logged at 01:30 on 1 January in Dubai is 21:30 on 31 December UTC
  # and belongs to the new year's series.
  #
  # Edited in place after review (PR #342 I3), which is safe only because this
  # changeset had never run anywhere shared: it is new in PR #342, main does not
  # carry it, and every deploy is from main.
  #
  # Existing tickets are backfilled per tenant and year in creation order, and
  # the counter is seeded one past the highest backfilled number so the next
  # ticket does not collide. The column stays nullable at the database level
  # (rows written outside the service, such as fixtures, have none); the service
  # always sets it, and the unique index holds for every row that has one.
  - changeSet:
      id: 95-ticket-reference
      author: rentaxis-system
      changes:
        - addColumn:
            tableName: maintenance_tickets
            columns:
              - column:
                  name: reference
                  type: varchar(20)
        - sql:
            sql: |
              WITH numbered AS (
                SELECT id,
                       tenant_id,
                       EXTRACT(YEAR FROM COALESCE(created_at AT TIME ZONE 'UTC', now()) AT TIME ZONE 'Asia/Dubai')::int AS yr,
                       ROW_NUMBER() OVER (
                         PARTITION BY tenant_id, EXTRACT(YEAR FROM COALESCE(created_at AT TIME ZONE 'UTC', now()) AT TIME ZONE 'Asia/Dubai')
                         ORDER BY created_at, id) AS n
                FROM maintenance_tickets
                WHERE tenant_id IS NOT NULL
              )
              UPDATE maintenance_tickets t
              SET reference = 'TKT-' || lpad((numbered.yr % 100)::text, 2, '0') || '/' || numbered.n
              FROM numbered
              WHERE t.id = numbered.id;
        - sql:
            sql: |
              INSERT INTO journal_entry_sequences (tenant_id, doc_type, fiscal_year, next_value)
              SELECT tenant_id, 'TKT', EXTRACT(YEAR FROM COALESCE(created_at AT TIME ZONE 'UTC', now()) AT TIME ZONE 'Asia/Dubai')::int, COUNT(*) + 1
              FROM maintenance_tickets
              WHERE tenant_id IS NOT NULL
              GROUP BY tenant_id, EXTRACT(YEAR FROM COALESCE(created_at AT TIME ZONE 'UTC', now()) AT TIME ZONE 'Asia/Dubai')
              ON CONFLICT (tenant_id, doc_type, fiscal_year)
              DO UPDATE SET next_value = GREATEST(journal_entry_sequences.next_value, EXCLUDED.next_value);
        - createIndex:
            tableName: maintenance_tickets
            indexName: ux_maintenance_tickets_tenant_reference
            unique: true
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: reference
