databaseChangeLog:
  - changeSet:
      id: 55-email-prefs-cascade
      author: rentaxis
      comment: >
        Recreate fk_email_prefs_user with ON DELETE CASCADE so deleting a
        user from the users table also removes their email_preferences row.
        Without this, UserService.deleteUser fails with a 500 (FK violation)
        on every user that has been backfilled into email_preferences.
      changes:
        - dropForeignKeyConstraint:
            baseTableName: email_preferences
            constraintName: fk_email_prefs_user
        - addForeignKeyConstraint:
            baseTableName: email_preferences
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_email_prefs_user
            onDelete: CASCADE
