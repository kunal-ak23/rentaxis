databaseChangeLog:
  - changeSet:
      id: 14-add-missing-indexes
      author: rentaxis
      changes:
        - sql:
            sql: >
              CREATE INDEX IF NOT EXISTS idx_properties_tenant_id ON properties(tenant_id);
              CREATE INDEX IF NOT EXISTS idx_buildings_tenant_id ON buildings(tenant_id);
              CREATE INDEX IF NOT EXISTS idx_units_tenant_id ON units(tenant_id);
              CREATE INDEX IF NOT EXISTS idx_units_property_id ON units(property_id);
              CREATE INDEX IF NOT EXISTS idx_users_tenant_id ON users(tenant_id);
              CREATE INDEX IF NOT EXISTS idx_payment_schedules_lease_due ON payment_schedules(lease_id, due_date);
              CREATE INDEX IF NOT EXISTS idx_financial_transactions_tenant_date ON financial_transactions(tenant_id, date);
              CREATE INDEX IF NOT EXISTS idx_leases_unit_id ON leases(unit_id);
              CREATE INDEX IF NOT EXISTS idx_leases_renter_id ON leases(renter_id);

  - changeSet:
      id: 14-add-version-columns
      author: rentaxis
      changes:
        - addColumn:
            tableName: leases
            columns:
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
        - addColumn:
            tableName: units
            columns:
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
