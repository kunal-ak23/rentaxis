# NOTE: The second UPDATE intentionally does not touch units.status so that
# MAINTENANCE units are preserved — but that also left units stale-marked
# OCCUPIED (with no ACTIVE lease) unchanged. Those rows are corrected by
# 70-reset-stale-occupied-units.yaml. YAML '#' comments are not part of the
# Liquibase checksum, so this annotation is safe on a deployed changeset.
databaseChangeLog:
  - changeSet:
      id: 68-backfill-unit-lease-metrics
      author: codex
      changes:
        - sql:
            splitStatements: false
            sql: |
              WITH latest_active_lease AS (
                SELECT DISTINCT ON (l.unit_id)
                  l.unit_id,
                  l.rent_amount,
                  r.name_en AS renter_name
                FROM leases l
                JOIN renters r ON r.id = l.renter_id
                WHERE l.status = 'ACTIVE'
                ORDER BY l.unit_id, l.start_date DESC, l.id DESC
              )
              UPDATE units u
              SET status = 'OCCUPIED',
                  actual_rent = COALESCE(a.rent_amount, 0),
                  current_tenant_name = a.renter_name
              FROM latest_active_lease a
              WHERE u.id = a.unit_id;

              UPDATE units u
              SET actual_rent = 0,
                  current_tenant_name = NULL
              WHERE NOT EXISTS (
                SELECT 1
                FROM leases l
                WHERE l.unit_id = u.id
                  AND l.status = 'ACTIVE'
              );
