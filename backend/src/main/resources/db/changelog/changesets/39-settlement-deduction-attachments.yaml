databaseChangeLog:
  - changeSet:
      id: 39-add-settlement-status
      author: rentaxis
      changes:
        - addColumn:
            tableName: lease_settlements
            columns:
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: FINALIZED
                  constraints:
                    nullable: false
      comment: "Add status column to lease_settlements. Default FINALIZED for existing rows."

  - changeSet:
      id: 39-create-settlement-deduction-attachments
      author: rentaxis
      changes:
        - createTable:
            tableName: settlement_deduction_attachments
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: deduction_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_sda_deduction
                    references: lease_settlement_deductions(id)
              - column:
                  name: tenant_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: file_url
                  type: varchar(1024)
                  constraints:
                    nullable: false
              - column:
                  name: file_type
                  type: varchar(100)
              - column:
                  name: file_size
                  type: bigint
              - column:
                  name: uploaded_at
                  type: timestamp
                  defaultValueComputed: now()
        - createIndex:
            tableName: settlement_deduction_attachments
            indexName: idx_settlement_deduction_attachments_deduction_id
            columns:
              - column:
                  name: deduction_id
        - createIndex:
            tableName: settlement_deduction_attachments
            indexName: idx_settlement_deduction_attachments_tenant_id
            columns:
              - column:
                  name: tenant_id
      comment: "Create settlement_deduction_attachments table for evidence files per deduction."

  - changeSet:
      id: 39-add-cascade-delete-on-deduction-fk
      author: rentaxis
      changes:
        - dropForeignKeyConstraint:
            baseTableName: settlement_deduction_attachments
            constraintName: fk_sda_deduction
        - addForeignKeyConstraint:
            baseTableName: settlement_deduction_attachments
            baseColumnNames: deduction_id
            constraintName: fk_sda_deduction
            referencedTableName: lease_settlement_deductions
            referencedColumnNames: id
            onDelete: CASCADE
      comment: "Add ON DELETE CASCADE to deduction FK so deleting deductions cleans up attachments."
