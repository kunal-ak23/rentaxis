databaseChangeLog:
  # Accounting v2 plan 2, Task 10. An online payment is now started against a
  # cheque-register row (online_payments.cheque_id, added in 83) and never
  # against a payment schedule — but online_payments.payment_schedule_id has
  # been NOT NULL since 13, so the first cheque-only row would be rejected by
  # the database before any of Task 10 could run.
  #
  # The constraint is dropped rather than the column: 84 deletes
  # payment_schedules and this column with it, and dropping the column here
  # would collide with that. 83 is edited by nobody — it is another task's
  # file — so this lands as its own changeset between 83 and 84.
  - changeSet:
      id: 83b-online-payment-schedule-nullable
      author: claude
      changes:
        - dropNotNullConstraint:
            tableName: online_payments
            columnName: payment_schedule_id
            columnDataType: uuid
      rollback:
        - addNotNullConstraint:
            tableName: online_payments
            columnName: payment_schedule_id
            columnDataType: uuid
