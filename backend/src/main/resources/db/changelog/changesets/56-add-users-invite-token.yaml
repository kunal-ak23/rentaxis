databaseChangeLog:
  - changeSet:
      id: 56-add-users-invite-token
      author: rentaxis
      comment: >
        Single-use invite tokens for tokenized USER_INVITED onboarding flow.
        Token cleared on first successful set-password redemption.
        Precondition mirrors changeset 54 — required so dev environments
        where the column has been pre-applied (because the test user does
        not own the users table) don't fail Liquibase startup.
      preConditions:
        - onFail: MARK_RAN
          not:
            columnExists:
              tableName: users
              columnName: invite_token
      changes:
        - addColumn:
            tableName: users
            columns:
              - column: { name: invite_token, type: varchar(64) }
              - column: { name: invite_token_expires_at, type: timestamp }
        - addUniqueConstraint:
            tableName: users
            columnNames: invite_token
            constraintName: uq_users_invite_token
