databaseChangeLog:
  - changeSet:
      id: 57-cascade-renters-user
      author: rentaxis
      comment: >
        Recreate fk_renters_user_id with ON DELETE CASCADE so deleting a
        user from the users table also removes their renter profile row.
        Without this, UserService.deleteUser fails with a 500 (FK violation)
        on every renter who has been linked to a users row.

        Same family of fix as changeset 55 (email_preferences). Note that
        leases.renter_id still RESTRICTs on renter deletion — so a user
        with active leases still cannot be deleted, which is desired.

        meetings.host_user_id / meetings.requester_user_id are intentionally
        left without cascade: they are NOT NULL columns, so SET NULL is not
        an option, and CASCADE would silently drop meeting history when a
        user is deleted. Audit retention wins; admins must terminate
        meetings explicitly before user deletion.
      changes:
        - dropForeignKeyConstraint:
            baseTableName: renters
            constraintName: fk_renters_user_id
        - addForeignKeyConstraint:
            baseTableName: renters
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_renters_user_id
            onDelete: CASCADE
