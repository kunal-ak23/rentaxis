databaseChangeLog:
  # PR #352 re-review R2: the AP opening item a cancelled cut-over cheque leaves on
  # its vendor ("Cancelled cheque <no>") is linked to that cheque by id, not only
  # by its name. The OB tie-out excludes it by the link, and the item cannot be
  # edited or deleted by hand. Backfill: an existing generated item is linked to
  # the CANCELLED opening cheque of the same vendor, number, amount and date; then
  # (PR #353 review) an item edited by hand since is linked on vendor and name
  # alone, where exactly one unlinked cancelled cheque fits. What is still
  # unlinked is reported as a NOTICE in the migration log.
  - changeSet:
      id: 113-ap-opening-cheque-link
      author: rentaxis-system
      changes:
        - addColumn:
            tableName: ap_opening_items
            columns:
              - column:
                  name: issued_cheque_id
                  type: uuid
                  constraints: { foreignKeyName: fk_ap_opening_items_issued_cheque, referencedTableName: issued_cheques, referencedColumnNames: id }
        - sql:
            comment: One generated item per cancelled cheque
            sql: |
              CREATE UNIQUE INDEX ux_ap_opening_items_issued_cheque ON ap_opening_items (issued_cheque_id)
                WHERE issued_cheque_id IS NOT NULL;
        - sql:
            comment: Link the items generated before this changeset
            sql: |
              WITH pairs AS (
                SELECT o.id AS item_id, c.id AS cheque_id,
                       row_number() OVER (PARTITION BY o.id ORDER BY c.created_at, c.id) AS ro,
                       row_number() OVER (PARTITION BY c.id ORDER BY o.created_at, o.id) AS rc
                  FROM ap_opening_items o
                  JOIN issued_cheques c
                    ON c.tenant_id = o.tenant_id
                   AND c.opening AND c.status = 'CANCELLED'
                   AND c.vendor_id = o.vendor_id
                   AND o.invoice_number = 'Cancelled cheque ' || c.cheque_number
                   AND o.amount = c.amount
                   AND o.invoice_date = c.cancelled_on
              )
              UPDATE ap_opening_items o
                 SET issued_cheque_id = p.cheque_id
                FROM pairs p
               WHERE p.item_id = o.id AND p.ro = 1 AND p.rc = 1;
        - sql:
            comment: Fallback on vendor and "Cancelled cheque <no>" alone, where exactly one pairing fits
            sql: |
              WITH pairs AS (
                SELECT o.id AS item_id, c.id AS cheque_id,
                       count(*) OVER (PARTITION BY o.id) AS no,
                       count(*) OVER (PARTITION BY c.id) AS nc
                  FROM ap_opening_items o
                  JOIN issued_cheques c
                    ON c.tenant_id = o.tenant_id
                   AND c.opening AND c.status = 'CANCELLED'
                   AND c.vendor_id = o.vendor_id
                   AND o.invoice_number = 'Cancelled cheque ' || c.cheque_number
                 WHERE o.issued_cheque_id IS NULL
                   AND NOT EXISTS (SELECT 1 FROM ap_opening_items x WHERE x.issued_cheque_id = c.id)
              )
              UPDATE ap_opening_items o
                 SET issued_cheque_id = p.cheque_id
                FROM pairs p
               WHERE p.item_id = o.id AND p.no = 1 AND p.nc = 1;
        - sql:
            comment: Report the cancelled cut-over cheques whose item could not be linked
            splitStatements: false
            sql: |
              DO $$
              DECLARE n integer;
              BEGIN
                SELECT count(*) INTO n FROM issued_cheques c
                 WHERE c.opening AND c.status = 'CANCELLED'
                   AND NOT EXISTS (SELECT 1 FROM ap_opening_items o WHERE o.issued_cheque_id = c.id);
                RAISE NOTICE '113-ap-opening-cheque-link: % cancelled cut-over cheque(s) have no linked opening item', n;
              END $$;
