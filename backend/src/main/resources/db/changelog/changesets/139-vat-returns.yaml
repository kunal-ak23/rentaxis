# #55: the VAT return. One row per tenant and quarter when it is marked filed; the
# figures the return showed are kept (boxes, JSON) as filed. A FILED row locks VAT
# postings dated in its period (PostingService); a re-open leaves the row REOPENED
# as the audit trail and a later filing writes a new one.
databaseChangeLog:
  - changeSet:
      id: 139-vat-returns
      author: claude
      changes:
        - createTable:
            tableName: vat_returns
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: uuid, constraints: { nullable: false } }
              - column: { name: period_start, type: date, constraints: { nullable: false } }
              - column: { name: period_end, type: date, constraints: { nullable: false } }
              - column: { name: status, type: varchar(12), constraints: { nullable: false } }
              - column: { name: boxes, type: text }
              - column: { name: net_vat, type: "numeric(14,2)" }
              - column: { name: filing_reference, type: varchar(100) }
              - column: { name: filed_by, type: uuid }
              - column: { name: filed_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: reopened_by, type: uuid }
              - column: { name: reopened_at, type: timestamptz }
              - column: { name: reopen_reason, type: varchar(500) }
        - sql:
            sql: |
              ALTER TABLE vat_returns ADD CONSTRAINT ck_vat_returns_status CHECK (status IN ('FILED', 'REOPENED'));
              ALTER TABLE vat_returns ADD CONSTRAINT ck_vat_returns_period CHECK (period_end >= period_start);
              CREATE UNIQUE INDEX ux_vat_returns_one_filed ON vat_returns (tenant_id, period_start) WHERE status = 'FILED';
              CREATE INDEX ix_vat_returns_tenant_period ON vat_returns (tenant_id, period_start, period_end);
      rollback:
        - sql:
            sql: DROP TABLE IF EXISTS vat_returns;
