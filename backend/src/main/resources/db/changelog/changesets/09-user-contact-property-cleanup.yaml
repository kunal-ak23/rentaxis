databaseChangeLog:
  - changeSet:
      id: add-phone-number-to-users
      author: antigravity
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: phone_number
                  type: varchar(255)
  - changeSet:
      id: drop-property-manager-from-properties
      author: antigravity
      changes:
        - dropColumn:
            columnName: property_manager
            tableName: properties
