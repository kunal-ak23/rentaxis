# F14-18 (round-15 ruling) + spec 2026-09-24 §4c: a charge type decides how a fee
# is earned and whether a renewal copies it.
#
#   - charge_types.recognition: RENT_LIKE (earned over the term like rent, copied
#     on renewal), ONE_OFF (income at posting, not copied), PASS_THROUGH (a utility
#     recovered at cost: credits the property's Utilities expense leaf, copied).
#     Existing FEE types on a periodic role (parking, cooling, maintenance) are
#     RENT_LIKE; every other FEE type (admin fee, penalties, other income) is
#     ONE_OFF. RENT and DEPOSIT types are RENT_LIKE.
#   - RENEWAL_FEE (ONE_OFF, VAT off) and UTILITIES (PASS_THROUGH) are added to every
#     tenant that already has a catalogue; ChargeTypeService.DEFAULTS seeds the rest.
#   - leases.fee_timing: OVER_TERM for drafts and new leases, AT_POSTING for every
#     lease already posted, so nothing on the books is restated. Cut-over imports
#     set AT_POSTING themselves (golden replays stay byte-identical).
#   - rent_segments.deferral_account_id / income_account_id: a fee's segment
#     remembers the leaf its TCO deferred into and the income leaf it releases to.
#   - B-01-08 "Unearned charges" and the UNEARNED_CHARGES default mapping for every
#     tenant whose chart has the B-01 group.
databaseChangeLog:
  - changeSet:
      id: 128-charge-recognition
      author: claude
      changes:
        - addColumn:
            tableName: charge_types
            columns:
              - column:
                  name: recognition
                  type: varchar(16)
                  defaultValue: RENT_LIKE
                  constraints: { nullable: false }
        - sql:
            comment: One-off fees stay income at posting and are not copied on renewal
            sql: |
              UPDATE charge_types SET recognition = 'ONE_OFF'
               WHERE behaviour = 'FEE'
                 AND (code = 'ADMIN_FEE' OR role NOT IN ('PARKING_INCOME', 'COOLING_CHARGES', 'MAINTENANCE_CHARGES'));
        - sql:
            comment: Renewal Fee and Utilities (at cost) for every tenant that already has a catalogue
            sql: |
              INSERT INTO charge_types (id, tenant_id, code, name_en, name_ar, role, behaviour, recognition,
                                        vat_applicable_default, active, display_order)
              SELECT gen_random_uuid(), t.tenant_id, 'RENEWAL_FEE', 'Renewal Fee', 'رسوم التجديد', 'ADMIN_FEE', 'FEE',
                     'ONE_OFF', FALSE, TRUE, 35
                FROM (SELECT DISTINCT tenant_id FROM charge_types) t
               WHERE NOT EXISTS (SELECT 1 FROM charge_types c WHERE c.tenant_id = t.tenant_id AND c.code = 'RENEWAL_FEE');
              INSERT INTO charge_types (id, tenant_id, code, name_en, name_ar, role, behaviour, recognition,
                                        vat_applicable_default, active, display_order)
              SELECT gen_random_uuid(), t.tenant_id, 'UTILITIES', 'Utilities (recovered at cost)',
                     'المرافق (مستردة بالتكلفة)', 'OTHER_INCOME', 'FEE', 'PASS_THROUGH', FALSE, TRUE, 80
                FROM (SELECT DISTINCT tenant_id FROM charge_types) t
               WHERE NOT EXISTS (SELECT 1 FROM charge_types c WHERE c.tenant_id = t.tenant_id AND c.code = 'UTILITIES');
        - addColumn:
            tableName: leases
            columns:
              - column:
                  name: fee_timing
                  type: varchar(12)
                  defaultValue: OVER_TERM
                  constraints: { nullable: false }
        - sql:
            comment: Leases already on the books keep fees as income at posting
            sql: UPDATE leases SET fee_timing = 'AT_POSTING' WHERE posted_at IS NOT NULL
        - addColumn:
            tableName: rent_segments
            columns:
              - column: { name: deferral_account_id, type: uuid, constraints: { foreignKeyName: fk_rs_deferral_account, referencedTableName: accounts, referencedColumnNames: id } }
              - column: { name: income_account_id, type: uuid, constraints: { foreignKeyName: fk_rs_income_account, referencedTableName: accounts, referencedColumnNames: id } }
        - sql:
            comment: B-01-08 Unearned charges, for every tenant whose chart has the B-01 group
            sql: |
              INSERT INTO accounts (id, tenant_id, code, name, name_en, name_ar, account_type, account_sub_type,
                                    parent_id, is_system, is_group, is_active, display_order, created_at, updated_at)
              SELECT gen_random_uuid(), g.tenant_id, 'B-01-08', 'Unearned charges', 'Unearned charges',
                     'رسوم غير مكتسبة', 'LIABILITY', 'ADVANCE',
                     g.id, TRUE, FALSE, TRUE, 0, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
                FROM accounts g
               WHERE g.code = 'B-01'
                 AND NOT EXISTS (SELECT 1 FROM accounts a WHERE a.tenant_id = g.tenant_id AND a.code = 'B-01-08');
        - sql:
            comment: UNEARNED_CHARGES tenant default mapping onto B-01-08
            sql: |
              INSERT INTO tenant_default_account_mappings (id, tenant_id, role, account_id)
              SELECT gen_random_uuid(), a.tenant_id, 'UNEARNED_CHARGES', a.id
                FROM accounts a
               WHERE a.code = 'B-01-08'
                 AND NOT EXISTS (SELECT 1 FROM tenant_default_account_mappings m
                                  WHERE m.tenant_id = a.tenant_id AND m.role = 'UNEARNED_CHARGES');
      rollback:
        - sql:
            sql: |
              DELETE FROM tenant_default_account_mappings WHERE role = 'UNEARNED_CHARGES';
              DELETE FROM accounts a WHERE a.code = 'B-01-08'
                AND NOT EXISTS (SELECT 1 FROM journal_lines l WHERE l.account_id = a.id);
              ALTER TABLE rent_segments DROP COLUMN IF EXISTS deferral_account_id;
              ALTER TABLE rent_segments DROP COLUMN IF EXISTS income_account_id;
              ALTER TABLE leases DROP COLUMN IF EXISTS fee_timing;
              DELETE FROM charge_types c WHERE c.code IN ('RENEWAL_FEE', 'UTILITIES')
                AND NOT EXISTS (SELECT 1 FROM lease_lines l WHERE l.charge_type_id = c.id);
              ALTER TABLE charge_types DROP COLUMN IF EXISTS recognition;
