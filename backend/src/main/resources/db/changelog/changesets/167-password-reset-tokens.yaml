databaseChangeLog:
  # Public "forgot password", review P2-1 (2026-10-15). The link belongs to the
  # PERSON (normalised email), not to one users row: a row someone else controls
  # (an organisation registered with the person's address, or an admin-typed
  # legacy row) can neither receive the link nor retire it by signing in.
  # Only a SHA-256 of the token is stored. Single use (used_at); 45 minutes.
  - changeSet:
      id: 167-password-reset-tokens
      author: claude
      changes:
        - createTable:
            tableName: password_reset_tokens
            columns:
              - column: { name: id, type: uuid, defaultValueComputed: gen_random_uuid(), constraints: { primaryKey: true, nullable: false } }
              - column: { name: email, type: varchar(320), constraints: { nullable: false } }
              - column: { name: token_hash, type: varchar(64), constraints: { nullable: false, unique: true, uniqueConstraintName: uq_password_reset_tokens_hash } }
              - column: { name: expires_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: used_at, type: timestamptz }
              - column: { name: created_at, type: timestamptz, defaultValueComputed: now(), constraints: { nullable: false } }
        - createIndex:
            tableName: password_reset_tokens
            indexName: idx_password_reset_tokens_email
            columns:
              - column: { name: email }
      rollback:
        - dropTable:
            tableName: password_reset_tokens
