# Sim round 23 S23-01: the term a contract's own undated lines were charged for is the
# lease's end date before its first extension. It used to be inferred from line dates
# (the day before the first line dated after the start), which a contract's own dated
# lines (stepped rent, a fee from month 3) also match. Now extend records it.
#
#   - leases.original_end_date: the end date the lease had before its first extension;
#     null when never extended (LeaseService.originalTermEnd falls back to end_date).
#   - Backfill from the extension's own record, not from dates: every extension writes a
#     lease_events row "Lease extended from <previous end> to <new end>, ...". The
#     earliest such row per lease gives the original end. Only rows whose date is before
#     the lease's current end are used. Only the accounting-v2 wording (", posted as <TCO>")
#     counts: a v1 extension (April-September 2026) only moved end_date, before leases had
#     lines, so whatever lines such a lease has were written for the extended term and its
#     original_end_date stays NULL (the term is the end date). Run
#     .superpowers/agents/prod-check-182-predeploy.sql on prod first.
databaseChangeLog:
  - changeSet:
      id: 182-lease-original-end-date
      author: claude
      changes:
        - addColumn:
            tableName: leases
            columns:
              - column: { name: original_end_date, type: date }
        - sql:
            comment: Backfill from the earliest "Lease extended from" event per lease
            sql: |
              UPDATE leases le
                 SET original_end_date = x.from_date
                FROM (SELECT DISTINCT ON (e.lease_id) e.lease_id, e.tenant_id,
                             substring(e.notes from '^Lease extended from ([0-9]{4}-[0-9]{2}-[0-9]{2}) to')::date AS from_date
                        FROM lease_events e
                       WHERE e.notes ~ '^Lease extended from [0-9]{4}-[0-9]{2}-[0-9]{2} to [0-9]{4}-[0-9]{2}-[0-9]{2}, posted as '
                       ORDER BY e.lease_id, e.created_at ASC, e.id) x
               WHERE le.id = x.lease_id AND le.tenant_id = x.tenant_id
                 AND le.original_end_date IS NULL
                 AND x.from_date < le.end_date
      rollback:
        - dropColumn: { tableName: leases, columnName: original_end_date }
