databaseChangeLog:
  # A retired rent segment outlives the lease line it was cut from.
  #
  # Amending a posted lease replaces its lines wholesale — LeaseService.applyLines
  # is delete-then-insert, and it flushes the delete before the amendment's event
  # is published — so by the time RecognitionService.rebuildAfterAmend runs, the
  # rows its segments point at are already gone. The segments themselves must not
  # go with them: a POSTED recognition entry explains a CIL journal an auditor can
  # still see, and the segment is where that entry's arithmetic came from.
  #
  # So the reference becomes optional and the database nulls it on delete. What a
  # retired segment keeps is its own numbers — window, amount, day rate — and what
  # it loses is a pointer to a row that no longer exists, which is the honest
  # record of what an amendment did. The only path that deletes a posted lease's
  # lines is amendLines, and the listener cancels every live segment in the same
  # transaction, so a segment that is still ACTIVE always has its line.
  - changeSet:
      id: 86-rent-segment-line-nullable
      author: claude
      changes:
        - dropForeignKeyConstraint: { baseTableName: rent_segments, constraintName: fk_rs_line }
        - dropNotNullConstraint: { tableName: rent_segments, columnName: lease_line_id, columnDataType: uuid }
        - addForeignKeyConstraint:
            baseTableName: rent_segments
            baseColumnNames: lease_line_id
            constraintName: fk_rs_line
            referencedTableName: lease_lines
            referencedColumnNames: id
            onDelete: SET NULL
      rollback:
        - sql:
            sql: |
              ALTER TABLE rent_segments DROP CONSTRAINT IF EXISTS fk_rs_line;
              DELETE FROM recognition_entries WHERE segment_id IN (SELECT id FROM rent_segments WHERE lease_line_id IS NULL);
              DELETE FROM rent_segments WHERE lease_line_id IS NULL;
              ALTER TABLE rent_segments ALTER COLUMN lease_line_id SET NOT NULL;
              ALTER TABLE rent_segments ADD CONSTRAINT fk_rs_line FOREIGN KEY (lease_line_id) REFERENCES lease_lines (id);
