version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rentaxis-postgres
    env_file:
      - .env.postgres
    ports:
      - "127.0.0.1:5432:5432" # Bind to localhost only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U rentaxis -d rentaxis" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rentaxis-network

volumes:
  postgres-data:

networks:
  rentaxis-network:
    driver: bridge
