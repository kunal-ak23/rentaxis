services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rentaxis-backend
    ports:
      - "8080:8080" # Dev only - use reverse proxy in production
    env_file:
      # Passes through every var in the file, including the optional auth
      # hardening secrets APP_AUTH_TOKEN_SECRET / INTERNAL_PROXY_SECRET
      # (add them to .env.backend to enable locally; absent = feature off).
      - .env.backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/rentaxis
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - rentaxis-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: rentaxis-web
    ports:
      - "3000:3000"
    env_file:
      # Passes through every var in the file, including the optional
      # INTERNAL_PROXY_SECRET the proxy attaches as X-Internal-Auth
      # (add it to .env.web to enable locally; absent = feature off).
      - .env.web
    environment:
      - BACKEND_URL=http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rentaxis-network

networks:
  rentaxis-network:
    driver: bridge
